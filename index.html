			<script>
    // Your exact live URL
    const databaseURL = "https://kvdb.io/MDLk1W5BezUeJ2FRJnA6sC/"; 
    let isOnline = true;

    const badge = document.getElementById('live-status');

    // 1. UPDATED FETCH: Clears the cache so other devices see instant updates
    async function fetchStatus() {
        try {
            // Adding a timestamp (?t=...) forces the browser to download fresh data, bypassing the cache!
            const cacheBusterURL = `${databaseURL}?t=${new Date().getTime()}`;
            const response = await fetch(cacheBusterURL);
            
            if (response.status === 404) {
                setOnlineUI(); 
                return;
            }
            
            const statusText = await response.text();
            
            // Sync the internal tracker variable to match what's in the database
            if (statusText.trim() === "offline") {
                setOfflineUI();
            } else {
                setOnlineUI();
            }
        } catch (error) {
            console.log("Failed to load real-time status.");
        }
    }

    // 2. TOGGLE STATUS: Runs when YOU tap the secret invisible dot
    async function toggleCloudStatus() {
        isOnline = !isOnline;
        const newStatus = isOnline ? "online" : "offline";

        // Instantly flip your own screen layout
        if (isOnline) { setOnlineUI(); } else { setOfflineUI(); }

        try {
            await fetch(databaseURL, {
                method: 'POST', 
                body: newStatus
            });
        } catch (error) {
            console.log("Database update failed.");
        }
    }

    function setOnlineUI() {
        isOnline = true;
        badge.innerText = "🟢 ONLINE TO PLAY";
        badge.style.backgroundColor = "#10b981"; // Green
    }

    function setOfflineUI() {
        isOnline = false;
        badge.innerText = "🔴 OFFLINE";
        badge.style.backgroundColor = "#ef4444"; // Red
    }

    // Run immediately when someone first lands on the page
    fetchStatus();

    // NEW REAL-TIME POLLING LOOP: 
    // Automatically checks the database for everyone else every 5 seconds (5000 milliseconds)
    setInterval(fetchStatus, 5000);
</script>
